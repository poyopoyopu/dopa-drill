<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#173b67">
<title>運行管理者ドリル｜貨物・旅客</title>
<style>
:root{--ink:#172033;--blue:#173b67;--cyan:#1d7ea8;--bg:#f4f7fa;--card:#fff;--line:#d8e0e8;--ok:#177245;--ng:#b42318;--gold:#e0a400}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;line-height:1.65}button{font:inherit}header{background:linear-gradient(135deg,#173b67,#215d83);color:#fff;padding:24px 18px 20px;position:sticky;top:0;z-index:5;box-shadow:0 2px 10px #0002}.wrap{max-width:760px;margin:auto}h1{font-size:24px;margin:0 0 4px}header p{margin:0;opacity:.9;font-size:13px}.tabs{display:flex;gap:8px;margin:14px 0}.tabs button,.filter button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 15px}.tabs button.active,.filter button.active{background:var(--blue);color:#fff;border-color:var(--blue)}main{padding:16px 14px 48px}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 2px 8px #17203308}.progress{height:10px;background:#e9eef3;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:#2a8fbd;width:0}.small{font-size:12px;color:#5c6875}.grid{display:grid;gap:12px}.lesson{border:1px solid var(--line);border-radius:14px;background:#fff;padding:14px;text-align:left}.lesson b{display:block}.lesson span{font-size:12px;color:#657180}.badge{display:inline-block;border-radius:999px;padding:2px 8px;font-size:11px;background:#eaf2f7;color:var(--blue);margin-left:5px}.primary{background:var(--blue);color:#fff;border:0;border-radius:12px;padding:12px 18px;font-weight:700}.secondary{background:#fff;color:var(--blue);border:1px solid var(--blue);border-radius:12px;padding:10px 16px}.actions{display:flex;gap:8px;flex-wrap:wrap}.question{font-size:19px;font-weight:700;margin:10px 0 18px}.choices{display:grid;gap:10px}.choice{padding:13px;text-align:left;background:#fff;border:2px solid var(--line);border-radius:12px}.choice.correct{border-color:var(--ok);background:#effaf3}.choice.wrong{border-color:var(--ng);background:#fff2f0}.explain{margin-top:14px;padding:12px;border-radius:12px;background:#f5f8fb;border-left:4px solid var(--cyan);font-size:14px}.source{font-size:11px;color:#657180;margin-top:8px}.source a{color:#245b8f}.score{font-size:34px;font-weight:800}.hidden{display:none!important}.back{border:0;background:transparent;color:var(--blue);padding:4px 0;font-weight:700}.tag{font-size:12px;color:#fff;background:#52677b;border-radius:999px;padding:3px 8px}.muted{color:#647282}.notice{background:#fff8df;border:1px solid #ead38b;padding:12px;border-radius:12px;font-size:13px}
</style>
</head>
<body>
<header><div class="wrap"><h1>運行管理者ドリル</h1><p>貨物・旅客｜基礎から本試験レベルへ</p></div></header>
<main class="wrap">
<section id="home">
<div class="panel">
<strong>学習状況</strong>
<div class="small" id="stat">0 / 0 問</div><div class="progress"><i id="bar"></i></div>
<div class="tabs" id="tabs">
<button class="active" data-mode="common">共通</button><button data-mode="cargo">貨物</button><button data-mode="passenger">旅客</button>
</div>
<div class="notice">この版は「何も知らないところから始める」ための第1段階です。まず用語と役割を理解し、その後に法令・実務・本試験問題へ進みます。</div>
</div>
<div class="panel">
<h2 id="modeTitle">共通基礎</h2><div class="grid" id="lessons"></div>
</div>
<div class="panel">
<h2>演習</h2><div class="actions">
<button class="primary" onclick="startQuiz('common')">共通知識 10問</button>
<button class="secondary" onclick="startQuiz('cargo')">貨物 10問</button>
<button class="secondary" onclick="startQuiz('passenger')">旅客 10問</button>
<button class="secondary" onclick="startMock()">確認テスト 30問</button>
</div></div>
</section>
<section id="lesson" class="hidden"><button class="back" onclick="goHome()">← 戻る</button><div class="panel"><span class="tag" id="lessonTag"></span><h2 id="lessonTitle"></h2><div id="lessonBody"></div><div class="actions"><button class="primary" onclick="lessonDone()">理解した</button><button class="secondary" onclick="goHome()">一覧へ</button></div></div></section>
<section id="quiz" class="hidden"><button class="back" onclick="goHome()">← 終了</button><div class="panel"><div class="small" id="qmeta"></div><div class="question" id="qtext"></div><div class="choices" id="choices"></div><div id="feedback"></div><div class="actions" style="margin-top:16px"><button class="primary hidden" id="next" onclick="nextQ()">次の問題</button></div></div></section>
<section id="result" class="hidden"><div class="panel"><h2>結果</h2><div class="score" id="resultScore"></div><p id="resultText"></p><div class="actions"><button class="primary" onclick="goHome()">ホームへ</button></div></div></section>
</main>
<script>
const lessons={
common:[
["運行管理者とは","運行管理者は、事業用自動車の運行の安全を確保するための業務を行う者です。運転者の乗務割、休憩・睡眠施設の管理、運転者への指導監督、点呼による疲労・健康状態の把握や安全運行の指示などが業務に含まれます。","国土交通省"],
["事業用自動車","試験では「事業用自動車」が基本語になります。まず、自動車運送事業で使用される車両について、安全な運行を管理するという全体像を押さえます。","国土交通省"],
["旅客と貨物","運行管理者試験には「旅客」と「貨物」の2種類があります。共通する安全管理の考え方を学んだあと、それぞれ固有の法令・実務へ進みます。","国土交通省"],
["点呼","点呼は、運転者の状態を確認し、安全な運行につなげる重要な管理業務です。まず「出発前・乗務後などに、必要な確認をして記録する」という役割を理解します。具体的な実施方法や記録事項は法令・通達で細かく定められています。","国土交通省"],
["運転者の健康・疲労","安全運行には運転者の健康状態や疲労状態の把握が重要です。運行管理者の仕事は、単に車両の予定を組むことではありません。人の状態を確認し、安全側に判断することも含まれます。","国土交通省"],
["乗務割・運行計画","運転者の乗務割や運行計画は、安全に運行できる条件を考えて作成・管理します。労働時間や休息など、複数のルールを組み合わせて判断する分野です。","国土交通省"],
["事故・安全管理","運行管理は事故が起きてから対応するだけではありません。事故を防ぐための指導、点呼、運行計画、健康状態の把握などを組み合わせて安全を確保します。","国土交通省"]
],
cargo:[
["貨物の基本","貨物分野では、貨物自動車運送事業法を中心に学びます。まず「貨物を運ぶ事業の安全をどう管理するか」という全体像を押さえます。","国土交通省"],
["貨物の運行管理","貨物の運行管理者も、事業用自動車の安全運行を確保するため、運転者の指導や点呼、乗務割などを管理します。貨物固有の法令を共通基礎の上に積み上げます。","国土交通省"],
["貨物法令の学び方","貨物自動車運送事業法、同法施行規則、輸送安全規則などを、試験で問われるテーマごとに整理していきます。数値や期限は改正されることがあるため、暗記カードだけでなく根拠条文も確認します。","国土交通省"]
],
passenger:[
["旅客の基本","旅客分野では、道路運送法や旅客自動車運送事業運輸規則などを中心に学びます。まず「乗客を安全に運ぶ事業の管理」という全体像を押さえます。","国土交通省"],
["旅客の運行管理","旅客の運行管理者も、事業用自動車の安全運行を確保するため、点呼、運転者への指導監督、乗務割などを管理します。旅客固有のルールを共通基礎の上に積み上げます。","国土交通省"],
["旅客固有の知識","バス・タクシーなど事業形態によって適用される規定が異なります。アプリでは、まず共通部分を固めてから事業形態ごとの違いを分けて学ぶ構成にします。","国土交通省"]
]};
const qs=[
["common","運行管理者の主な目的として最も基本的なものは？",["事業用自動車の安全な運行を確保する","車両を販売する","運賃を自由に決める","道路を建設する"],0,"国土交通省は、運行管理者について事業用自動車の運行の安全を確保するための業務を行う者と説明しています。"],
["common","運行管理者の業務に含まれるものは？",["運転者の乗務割の作成","自動車の販売営業","道路工事の発注","乗客の切符販売だけ"],0,"乗務割の作成は国土交通省が挙げる運行管理者の業務の一つです。"],
["common","運行管理者試験の種類は？",["旅客と貨物","大型と小型だけ","国内と海外","昼間と夜間"],0,"国土交通省は試験の種類として旅客、貨物の2種類を示しています。"],
["common","点呼の基本的な役割に最も近いものは？",["運転者の状態を確認し安全運行につなげる","車両を販売する","売上だけを集計する","道路を修理する"],0,"点呼は運転者の疲労・健康状態等の把握や安全運行の指示につながる重要な業務です。"],
["common","運行管理者が見る対象として適切なのは？",["運転者の疲労・健康状態など","天気だけ","車の色だけ","会社の広告だけ"],0,"国土交通省は点呼による運転者の疲労・健康状態等の把握を業務として示しています。"],
["cargo","貨物分野で中心となる法律は？",["貨物自動車運送事業法","食品衛生法だけ","著作権法","建築基準法"],0,"貨物の運行管理者試験では貨物自動車運送事業法などが関係します。"],
["passenger","旅客分野で中心となる法律は？",["道路運送法","著作権法","建築基準法","食品衛生法だけ"],0,"旅客分野では道路運送法などが重要な法令です。"],
["common","運行管理者の仕事について正しい考え方は？",["事故防止のために複数の安全管理を組み合わせる","事故が起きた後だけ対応する","運転者には関係しない","車両整備だけを担当する"],0,"点呼、指導監督、乗務割などを組み合わせて安全運行を確保することが基本です。"]
];
let mode="common", current=null, qi=0, score=0, answered=false, lessonKey=null;
const state=JSON.parse(localStorage.getItem("unkan-v1")||'{"done":0,"total":0,"lessons":[]}');
function save(){localStorage.setItem("unkan-v1",JSON.stringify(state));renderStats()}
function renderStats(){document.querySelector("#stat").textContent=`回答 ${state.total}問・正解 ${state.done}問`;document.querySelector("#bar").style.width=(state.total?Math.round(state.done/state.total*100):0)+"%"}
function setMode(m){mode=m;document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("active",b.dataset.mode===m));document.querySelector("#modeTitle").textContent={common:"共通基礎",cargo:"貨物基礎",passenger:"旅客基礎"}[m];document.querySelector("#lessons").innerHTML=lessons[m].map((x,i)=>`<button class="lesson" onclick="openLesson('${m}',${i})"><b>${i+1}. ${x[0]} ${state.lessons.includes(m+":"+i)?'<span class="badge">理解済み</span>':''}</b><span>${x[1].slice(0,58)}…</span></button>`).join("")}
document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
function hideAll(){["home","lesson","quiz","result"].forEach(x=>document.getElementById(x).classList.add("hidden"))}
function goHome(){hideAll();document.getElementById("home").classList.remove("hidden");setMode(mode)}
function openLesson(m,i){lessonKey=m+":"+i;const x=lessons[m][i];hideAll();document.getElementById("lesson").classList.remove("hidden");document.getElementById("lessonTag").textContent={common:"共通",cargo:"貨物",passenger:"旅客"}[m];document.getElementById("lessonTitle").textContent=x[0];document.getElementById("lessonBody").innerHTML=`<p>${x[1]}</p><div class="source">根拠：${x[2]}（国土交通省）</div>`}
function lessonDone(){if(!state.lessons.includes(lessonKey))state.lessons.push(lessonKey);save();goHome()}
function startQuiz(m){const bank=qs.filter(q=>q[0]===m||m==="common"&&q[0]==="common");current=bank;qi=0;score=0;answered=false;hideAll();document.getElementById("quiz").classList.remove("hidden");showQ()}
function startMock(){current=[...qs,...qs,...qs,...qs].slice(0,30);qi=0;score=0;answered=false;hideAll();document.getElementById("quiz").classList.remove("hidden");showQ()}
function showQ(){answered=false;const q=current[qi];document.getElementById("qmeta").textContent=`第${qi+1}問 / ${current.length}問　${q[0]==="cargo"?"貨物":q[0]==="passenger"?"旅客":"共通"}`;document.getElementById("qtext").textContent=q[1];document.getElementById("choices").innerHTML=q[2].map((c,i)=>`<button class="choice" onclick="answer(${i})">${String.fromCharCode(65+i)}. ${c}</button>`).join("");document.getElementById("feedback").innerHTML="";document.getElementById("next").classList.add("hidden")}
function answer(i){if(answered)return;answered=true;const q=current[qi],buttons=[...document.querySelectorAll(".choice")];buttons[q[3]].classList.add("correct");if(i===q[3])score++;else buttons[i].classList.add("wrong");state.total++;if(i===q[3])state.done++;save();document.getElementById("feedback").innerHTML=`<div class="explain"><b>${i===q[3]?"正解":"不正解"}</b><br>${q[4]}</div>`;document.getElementById("next").classList.remove("hidden")}
function nextQ(){qi++;if(qi>=current.length){hideAll();document.getElementById("result").classList.remove("hidden");document.getElementById("resultScore").textContent=`${score} / ${current.length}`;document.getElementById("resultText").textContent=score===current.length?"全問正解。基礎が定着しています。":"間違えた問題は説明を読み直して、もう一度解いてみましょう。";return}showQ()}
renderStats();setMode("common");
</script>
</body>
</html>
