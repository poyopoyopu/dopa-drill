<!-- SNS用のシェア画像(app/og.png, 1200x630)の元。app/ に一時的にコピーして http.server で開き、1200x630でスクリーンショットする -->
<!doctype html><html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{background:#fff8ec;display:grid;grid-template-columns:600px 1fr;align-items:center;
 background-image:linear-gradient(rgba(59,107,255,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(59,107,255,.08) 1px,transparent 1px);background-size:32px 32px}
.l{display:grid;place-items:center;height:630px}
.l .logo{--fs:120px;margin:40px 0 0}
.l .logo *{animation:none!important}
.r{padding:0 56px 0 0;font-family:var(--round);color:var(--ink)}
.r h2{margin:0 0 18px;font-family:var(--chunky);font-weight:400;font-size:50px;line-height:1.25}
.r ul{list-style:none;margin:0 0 26px;padding:0;display:grid;gap:12px}
.r li{font-size:30px;font-weight:900;padding:8px 20px;border:4px solid var(--ink);border-radius:18px;background:#fff;box-shadow:0 6px 0 var(--ink)}
.r li b{color:#ff4f8b}
.r p{margin:0;font-size:26px;font-weight:900;opacity:.75}
</style></head><body>
<div class="l"><h1 id="logo" class="logo" aria-label="運行管理ドリル">
        <svg class="logo-burst" viewBox="-100 -100 200 200" aria-hidden="true"><path id="logo-burst-path" fill="#ffd23f" stroke="#1b1d4d" stroke-width="5" stroke-linejoin="round"/><path id="logo-burst-inner" fill="#ff7ab6" stroke="#1b1d4d" stroke-width="4" stroke-linejoin="round"/></svg>
        <span class="logo-top" aria-hidden="true"><i data-c="運">運</i><i data-c="行">行</i><i data-c="管">管</i><i data-c="理">理</i></span>
        <span class="logo-ribbon" aria-hidden="true"><svg class="ribbon-bg" viewBox="0 0 300 70" preserveAspectRatio="none"><path d="M4 22 L34 16 L28 36 L40 58 L6 62 L18 42Z" fill="#2a4fd6" stroke="#1b1d4d" stroke-width="4" stroke-linejoin="round"/><path d="M296 22 L266 16 L272 36 L260 58 L294 62 L282 42Z" fill="#2a4fd6" stroke="#1b1d4d" stroke-width="4" stroke-linejoin="round"/><path d="M30 10 Q150 -4 270 10 L270 56 Q150 42 30 56Z" fill="#3b6bff" stroke="#1b1d4d" stroke-width="4.5" stroke-linejoin="round"/><path d="M42 18 Q150 6 258 18" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="7 6" stroke-linecap="round" opacity=".7"/></svg><i>ド</i><i>リ</i><i>ル</i></span>
        <span class="logo-bits" aria-hidden="true"><b style="--x:-46%;--y:4%;--r:-18deg;--c:#3fdcb0">○</b><b style="--x:44%;--y:-2%;--r:14deg;--c:#a77bff">？</b><b style="--x:-34%;--y:104%;--r:10deg;--c:#ff4f6d">×</b><b style="--x:36%;--y:102%;--r:-12deg;--c:#ffd23f">✓</b></span>
      </h1></div>
<div class="r"><h2>運行管理者試験の<br>無料ドリル</h2>
<ul><li>貨物・旅客 <b>900問</b></li><li>本番形式の<b>模擬試験</b> 30問・90分</li><li>解くたびに演出が<b>インフレ</b></li></ul>
<p>unko-drill.pages.dev</p></div>
<script>
const $=(q)=>document.querySelector(q);
const star = (R, r, n, jitter, seed) => {
  let d = ''; let s0 = seed;
  const rnd = () => { s0 = (s0 * 9301 + 49297) % 233280; return s0 / 233280; };
  for (let i = 0; i < n * 2; i++) {
    const a = (i / (n * 2)) * Math.PI * 2 - Math.PI / 2;
    const rr = (i % 2 ? r : R) * (1 + (rnd() - 0.5) * jitter);
    d += `${i ? 'L' : 'M'}${(Math.cos(a) * rr).toFixed(1)} ${(Math.sin(a) * rr).toFixed(1)}`;
  }
  return `${d}Z`;
};
$('#logo-burst-path').setAttribute('d', star(96, 66, 14, 0.14, 7));
$('#logo-burst-inner').setAttribute('d', star(70, 52, 14, 0.1, 3));
</script>
</body></html>
